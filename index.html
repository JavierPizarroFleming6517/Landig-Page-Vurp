<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Vurp diseña software a medida, automatización y ciberseguridad para ordenar la operación de tu empresa. Coquimbo, Chile."
    />
    <meta name="theme-color" content="#121016" />
    <script>
      // Tema antes del primer paint: ?debug&theme= (no se guarda), la elección guardada o la preferencia del sistema.
      (function () {
        var theme;
        try {
          var params = new URLSearchParams(location.search);
          if (params.has("debug")) theme = params.get("theme");
          if (theme !== "light" && theme !== "dark") theme = localStorage.getItem("vurp-theme");
        } catch (error) {}
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        if (theme === "light") document.querySelector('meta[name="theme-color"]').content = "#faf7f2";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Vurp · Software & Cybersecurity</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
